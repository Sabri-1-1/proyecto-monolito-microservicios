name: CI - Monolito y Microservicios

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-monolito:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Levantar monolito
        run: docker compose up -d --build
        working-directory: monolito

      - name: Esperar a que los servicios esten listos
        run: |
          until [ "$(docker inspect --format='{{json .State.Health.Status}}' monolito-db 2>/dev/null)" = "\"healthy\"" ]; do
            echo "Esperando a la base de datos del monolito..."
            sleep 2
          done
        working-directory: monolito

      - name: Ejecutar pruebas del monolito
        run: docker compose exec -T app npm test
        working-directory: monolito

      - name: Bajar servicios
        if: always()
        run: docker compose down
        working-directory: monolito

  test-microservicios:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Levantar microservicios
        run: docker compose up -d --build
        working-directory: microservicios

      - name: Esperar a que la base de datos de Pedidos este lista
        run: |
          until [ "$(docker inspect --format='{{json .State.Health.Status}}' pedidos-db 2>/dev/null)" = "\"healthy\"" ]; do
            echo "Esperando a pedidos-db..."
            sleep 2
          done
        working-directory: microservicios

      - name: Ejecutar pruebas de Pedidos
        run: docker compose exec -T pedidos npm test
        working-directory: microservicios

      - name: Bajar servicios
        if: always()
        run: docker compose down
        working-directory: microservicios
