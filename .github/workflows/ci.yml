name: CI - Monolito y Microservicios

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-monolito:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Levantar monolito
        run: docker compose up -d --build
        working-directory: monolito

      - name: Esperar a la base de datos y ejecutar pruebas
        run: |
          sleep 5
          docker compose exec -T app npm test
        working-directory: monolito

      - name: Bajar servicios
        run: docker compose down
        working-directory: monolito

  test-microservicios:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Levantar microservicios
        run: docker compose up -d --build
        working-directory: microservicios

      - name: Esperar a los servicios y ejecutar pruebas
        run: |
          sleep 10
          docker compose exec -T pedidos npm test
        working-directory: microservicios

      - name: Bajar servicios
        run: docker compose down
        working-directory: microservicios
